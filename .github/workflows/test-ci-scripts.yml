name: Test CI scripts

# The step tests read the run: blocks of the workflows listed after the scripts.
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/test-ci-scripts.yml'
      - '.github/workflows/evaluate-all-skills.yml'
      - '.github/workflows/evaluate-per-model.yml'
      - '.github/workflows/generate-testcases.yml'
      - '.github/workflows/skill-quality-check.yml'
      - '.github/workflows/validate-plugins.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/test-ci-scripts.yml'
      - '.github/workflows/evaluate-all-skills.yml'
      - '.github/workflows/evaluate-per-model.yml'
      - '.github/workflows/generate-testcases.yml'
      - '.github/workflows/skill-quality-check.yml'
      - '.github/workflows/validate-plugins.yml'

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install 'pytest==9.1.1' 'pyyaml==6.0.3'

      - name: Run tests
        run: python -m pytest .github/scripts/tests -q
