name: Test CI scripts

# The step tests read the run: blocks of the workflows listed after the scripts.
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/test-ci-scripts.yml'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/evaluate-all-skills.yml'
      - '.github/workflows/evaluate-per-model.yml'
      - '.github/workflows/generate-testcases.yml'
      - '.github/workflows/skill-quality-check.yml'
      - '.github/workflows/validate-plugins.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/test-ci-scripts.yml'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/evaluate-all-skills.yml'
      - '.github/workflows/evaluate-per-model.yml'
      - '.github/workflows/generate-testcases.yml'
      - '.github/workflows/skill-quality-check.yml'
      - '.github/workflows/validate-plugins.yml'

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          environments: ci
          locked: true

      - name: Run tests
        run: pixi run test-scripts
