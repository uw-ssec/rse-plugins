name: Tessl PR Skill Review
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review@main
        with:
          # Advisory only: still posts the per-skill score comment, but never
          # fails the check (fail-threshold 0 = never fail). The hosted action's
          # scorer runs ~15-20pts harsher and noisier than the pinned local
          # `tessl` CLI; skill quality is gated via the superpowers:writing-skills
          # rubric instead. Raise this again if the action's calibration stabilizes.
          fail-threshold: 0
